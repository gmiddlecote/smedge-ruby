AllCops:
  TargetRubyVersion: 3.4.4
  SuggestExtensions: false
  NewCops: enable

Layout/LineLength:
  Max: 250

Metrics/AbcSize:
  Max: 120

Metrics/MethodLength:
  Max: 80

Metrics/CyclomaticComplexity:
  Max: 30

Metrics/PerceivedComplexity:
  Max: 30

Metrics/BlockLength:
  Max: 150

Metrics/ClassLength:
  Max: 300

Metrics/ModuleLength:
  Max: 350

Metrics/ParameterLists:
  Max: 8

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/ClassVars:
  Enabled: false

# The existing codebase intentionally keeps related web and persistence logic
# together. These style preferences would require mechanical, non-functional
# rewrites; retain the project conventions while enforcing functional checks.
Style/Documentation:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Layout/ArgumentAlignment:
  Enabled: false

Layout/CommentIndentation:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/EmptyLines:
  Enabled: false

Layout/EmptyLinesAroundBlockBody:
  Enabled: false

Layout/HashAlignment:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  Enabled: false

Layout/TrailingWhitespace:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false
